<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Defines the document as an HTML5 webpage -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title that appears on the browser tab -->
    <title>Enquiry - My Coffee Shop</title>

    <!-- Connects this HTML page to the external CSS stylesheet -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Header contains the top section of the webpage -->
    <header>

        <!-- Nav contains the navigation links used to move between pages -->
        <nav>

            <!-- Displays the coffee shop logo -->
            <img src="images/logo.png" alt="Bean and Brew Coffee Shop Logo">

            <!-- Unordered list containing the website navigation links -->
            <ul>

                <!-- Link to the Home page -->
                <li><a href="index.html">Home</a></li>

                <!-- Link to the About Us page -->
                <li><a href="about_us.html">About Us</a></li>

                <!-- Link to the Products page -->
                <li><a href="products.html">Products</a></li>

                <!-- Link to the Enquiry page -->
                <li><a href="enquiry.html">Enquiry</a></li>

                <!-- Link to the Contact page -->
                <li><a href="contacts.html">Contact</a></li>

            </ul>

        </nav>

    </header>


    <!-- Main contains the main content of the Enquiry page -->
    <main>

        <!-- Introduction section for the enquiry page -->
        <section class="intro">

            <!-- Main heading of the page -->
            <h1>Make an Enquiry</h1>

            <!-- Short explanation for customers -->
            <p>
                Have a question or need more information?
                Complete the form below and we will get back to you.
            </p>

        </section>


        <!-- Enquiry form section -->
        <section class="featured">

            <!-- Heading for the enquiry form -->
            <h2>Enquiry Form</h2>

            <!-- Form allows customers to submit their information -->
            <form>

                <!-- Label and input for the customer's name -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <!-- Label and input for the customer's email address -->
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <!-- Label and input for the customer's phone number -->
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <br><br>

                <!-- Label and dropdown for selecting an enquiry type -->
                <label for="enquiry">Enquiry Type:</label>

                <select id="enquiry" name="enquiry">

                    <!-- Option for general enquiries -->
                    <option value="general">General Enquiry</option>

                    <!-- Option for product enquiries -->
                    <option value="products">Products</option>

                    
                    <!-- Option for special orders -->
                    <option value="orders">Special Orders</option>

                </select>

                <br><br>

                <!-- Label and text area for the customer's message -->
                <label for="message">Message:</label>
                <br>

                <textarea id="message" name="message" rows="6" cols="40"
                    placeholder="Enter your enquiry here..."></textarea>

                <br><br>

                <!-- Button used to submit the enquiry form -->
                <button type="submit">Submit Enquiry</button>

            </form>

        </section>

    </main>


    <!-- Footer contains information displayed at the bottom of the webpage -->
    <footer>

        <!-- Copyright information -->
        <p>&copy; 2026 My Coffee Shop. All rights reserved.</p>

    </footer>

</body>

</html>
